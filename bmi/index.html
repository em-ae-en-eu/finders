<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9ED6B0">
    <title>BmiFinder!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="bmi.css">
    <meta name="color-scheme" content="only light">
</head>
<body class="theme-green">
    <main class="card">
        <h1>BMI Finder 🌿</h1>
        <p class="intro">Enter your height and weight to find your BMI:</p>

        <div class="names">
            <div class="field">
                <label for="height">Height (cm)</label>
                <input type="number" id="height" placeholder="e.g. 170" min="50" max="250" step="0.1" inputmode="decimal">
            </div>
            <div class="field">
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g. 65" min="10" max="400" step="0.1" inputmode="decimal">
            </div>
        </div>

        <button onclick="findBmi()">Find BMI</button>

        <p id="result" class="result" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
