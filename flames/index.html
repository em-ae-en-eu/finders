<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F4A6C0">
    <title>FlamesFinder!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <meta name="color-scheme" content="only light">
</head>
<body>
    <main class="card">
        <h1>Flames Finder 💗</h1>
        <p class="intro">Enter your name and the person's name you want to find Flames of:</p>

        <div class="names">
            <div class="field">
                <label for="name1">Your name</label>
                <input type="text" id="name1" placeholder="Enter your name" maxlength="50">
            </div>
            <div class="field">
                <label for="name2">Their name</label>
                <input type="text" id="name2" placeholder="Enter their name" maxlength="50">
            </div>
        </div>

        <button onclick="findFlames()">Find Flames</button>

        <p id="result" class="result" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
